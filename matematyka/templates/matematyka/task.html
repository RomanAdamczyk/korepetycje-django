<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <title>Zadanie</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    .section {
      margin-bottom: 20px;
    }

    .section h2 {
      margin-bottom: 10px;
    }

    ul {
      padding-left: 20px;
    }
  </style>
</head>

<body>

  <h1>Rozwiązywanie zadania</h1>

  <div id="issue-container">
    <div class="section">
      <h2>Treść zadania</h2>
      <div id="task-content">Ładowanie...</div>
    </div>

    <div class="section">
      <h2>Wykorzystane zmienne</h2>
      <ul id="used-variables"></ul>
    </div>

    <div class="section">
      <h2>Odpowiedzi</h2>
      <ul id="answer-options"></ul>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {

    const taskId = {{ issue.task.id }};
    const taskContentDiv = document.getElementById('task-content');
    const usedVariablesList = document.getElementById('used-variables');
    const answerOptionsList = document.getElementById('answer-options');

    fetch(`/api/tasks/${taskId}/start_original_variables/`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': getCookie('csrftoken')
      },
      body: JSON.stringify({})
    })
      .then(response => {
        if (!response.ok) throw new Error(`Błąd sieci: ${response.status}`);
        return response.json();
      })
      .then(data => {
        // 1. Treść zadania
        taskContentDiv.innerText = data.task.content;

        // 2. Zmienne
        usedVariablesList.innerHTML = '';
        data.used_variables.forEach(uv => {
          const li = document.createElement('li');
          li.textContent = `${uv.variable_name} = ${uv.variable_value}`;
          usedVariablesList.appendChild(li);
        });

        // 3. Odpowiedzi
        answerOptionsList.innerHTML = '';
        data.answer_options.forEach(opt => {
          const li = document.createElement('li');
          li.textContent = `${opt.content} (${opt.format})`;
          answerOptionsList.appendChild(li);
        });
      })
      .catch(err => {
        taskContentDiv.innerText = 'Nie udało się załadować danych.';
        console.error(err);
      });
});

    // funkcja pobierająca CSRF z ciasteczka
    function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
        document.cookie.split(';').forEach(c => {
          c = c.trim();
          if (c.startsWith(name + '=')) {
            cookieValue = decodeURIComponent(c.slice(name.length + 1));
          }
        });
      }
      return cookieValue;
    }
  </script>


</body>

</html>
