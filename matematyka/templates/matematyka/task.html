{% extends 'base.html' %}

{% block content %}

<div class="task-content">
    <!-- Tutaj trafia treść zadania -->
    <div id="task-content">Ładowanie zadania…</div>

    <!-- Pojawi się tu formularz z odpowiedziami -->
    <form method="post" id="answer-form">
        <div class="row row-cols-1 row-cols-md-2 g-3" id="answers-container">
            <!-- <div class="col">…</div> będzie dokładane przez JS -->
        </div>
        <div class="mt-4">
            <button type="submit" class="btn btn-success">Zatwierdź</button>
        </div>
    </form>

</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
    const issueId = "{{ issue.id }}";
    const taskId = "{{issue.task.id}}";
    const taskDiv = document.getElementById('task-content');
    const answersBox = document.getElementById('answers-container');

    fetch(`/api/tasks/${taskId}/start_original_variables/`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCookie('csrftoken')
        },
        body: JSON.stringify({})
    })
        .then(r => r.ok ? r.json() : Promise.reject(r.status))
        .then(data => {
            // 1) Treść zadania
            taskDiv.innerHTML = data.task.content;

            // 2) Odpowiedzi
            answersBox.innerHTML = '';
            data.answer_options.forEach((opt, idx) => {
                const col = document.createElement('div');
                col.className = 'col';

                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'answer';
                radio.id = 'answer' + idx;
                radio.value = opt.content;
                radio.required = true;
                radio.className = 'btn-check';

                const label = document.createElement('label');
                label.htmlFor = radio.id;
                label.className = 'btn btn-outline-custom w-100 p-3 text-start';
                label.innerHTML = opt.content;

                col.appendChild(radio);
                col.appendChild(label);
                answersBox.appendChild(col);
            });
        })
        .catch(err => {
            taskDiv.innerText = 'Nie udało się załadować danych.';
            console.error(err);
        });
});

    // pobranie CSRF
    function getCookie(name) {
        let v = null;
        document.cookie.split(';').forEach(c => {
            c = c.trim();
            if (c.startsWith(name + '=')) v = decodeURIComponent(c.slice(name.length + 1));
        });
        return v;
    }
</script>

{% endblock %}
